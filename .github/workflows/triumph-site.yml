name: Deploy Triumph Guides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "elumia*.html"
      - "js/elumia-database2.js"
      - "js/elumia-database2-gate.js"
      - "triumph-guides.css"
      - ".github/workflows/triumph-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_BfpaKfdneQ3X8fJY2arks38d
          VERCEL_PROJECT_ID: prj_MDNcMecwZKdRfLtImZPgD4KJxXmu
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
